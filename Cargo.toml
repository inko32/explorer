[package]
name = "explorer"
version = "0.1.0"
edition = "2021"
description = "Windows 8 style file explorer for POSIX/Windows — iced spike"
license = "MIT"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "crisp", "thread-pool", "svg", "image", "advanced"] } # wgpu primary + tiny-skia fallback (D17); pick at runtime via --render
gio  = "0.21"  # GIO backend for the VFS (local fs, volumes, trash)
glib = "0.21"  # gio companion
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"  # ribbon.yaml parsing (D12)
libloading = "0.8"  # dlopen 7z.so for the native archive backend (D16)

[profile.release]
opt-level = 2
debug = false
strip = "symbols"
