[package]
name = "explorer"
version = "0.1.1"
edition = "2024"
description = "Windows 8 style file explorer for POSIX/Windows — iced spike"
license = "MIT"

[features]
# TEMPORARY (migrate-iced-vello branch): wgpu is not a default feature here;
# the vello-cpu software renderer is the only compiled-in backend.
default = []
# GPU renderer (wgpu); vello-cpu stays compiled in as the CPU fallback.
# Default on; a vello-cpu-only build is `make check NO_DEFAULT=1`.
# `--render gpu` fails at startup when this feature is off.
wgpu = ["iced/wgpu"]
# X11 windowing backend (winit). Default off (Wayland-only build);
# enable with `make check FEATURES=x11`.
x11 = ["iced/x11"]
# Embed the UI font (assets/fonts/selawik.regular.ttf, SIL OFL).
# Default: off (system fonts only). `make build FEATURES=embed-selawik`.
embed-selawik = []
# CPU-renderer build (`make dist-cpu`): vello-cpu is the startup default
# instead of wgpu. wgpu stays compiled in; an explicit --render flag
# still overrides this default.
cpu-render = []

[dependencies]
# iced is declared per-target (same rev/features except `wayland`, which
# only the unix build wants — cargo would otherwise unify the feature
# into the Windows build, where winit's `platform::wayland` is compiled
# out and the raw-handle overlay patch fails to build).
iced = { git = "https://github.com/iced-rs/iced", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11", default-features = false, features = ["vello-cpu", "crisp", "thread-pool", "svg", "image", "canvas", "advanced"] } # wgpu primary + vello-cpu fallback (D17); pick at runtime via --render

serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"  # ribbon.yaml parsing (D12)
# Same resvg 0.48 build iced's SVG pipeline uses; the raster-images
# feature unifies onto it so embedded <image> in SVG decodes (the
# gray-scaled-faded disabled icons wrap PNGs in a filtered SVG).
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
libloading = "0.9"  # dlopen 7z.so / 7z.dll for the native archive backend (D16)
fontdb = "0.24"  # system font probing for the fonts.yaml fallback list (already in the tree via cosmic-text)
image = { version = "0.25", default-features = false, features = ["png"] }
cosmic-text = { git = "https://github.com/hecrj/cosmic-text.git", rev = "6adc2364289fd241daed751948a03d0aea5a31ca" }  # same rev iced pins

# --- Unix-only (GIO VFS backend + Wayland side-channel) ---------------------
# The `Backend` trait seam in src/fs keeps these out of the Windows build:
# GIO is replaced by the std::fs backend (src/fs/std_backend.rs) and the
# Wayland side-channel modules (dnd/popup/icon/raw_handle_wayland) are
# compiled out, with src/dnd_wayland_stub.rs providing the no-op GUI API.
[target.'cfg(unix)'.dependencies]
# unix build adds iced's `wayland` feature (declared here rather than in
# [dependencies]: cargo would otherwise unify the feature into the
# Windows build, where winit's `platform::wayland` is compiled out and
# the raw-handle overlay patch fails to build).
iced = { git = "https://github.com/iced-rs/iced", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11", default-features = false, features = ["wayland"] }
gio  = "0.22"  # GIO backend for the VFS (local fs, volumes, trash)
glib = "0.22"  # gio companion
# winit/iced have no Wayland data-device, xdg_popup hosting, or toplevel
# icon; the side-channel thread wraps winit's connection (via the raw
# handles from deps/iced-raw-handle.patch) and drives wl_data_device,
# xdg_popup and xdg_toplevel_icon_v1 itself. All of these are already in
# the cargo tree (sctk via winit, cosmic-text via iced, image via iced).
smithay-client-toolkit = "=0.21.1"
wayland-protocols = { version = "0.32", features = ["staging"] }  # xdg-toplevel-icon-v1 (taskbar icon); staging is already on via sctk
wayland-client = "0.31"
wayland-backend = "0.3"
rustix = { version = "1", features = ["event", "pipe", "fs"] }

[target.'cfg(not(unix))'.dependencies]
# Enumerating HKLM\...\Fonts so the app can load wine's registered fonts
# (wine lists its bundled/host fonts in the registry only — as absolute
# Z:\ paths — and leaves C:\Windows\Fonts empty). Already in the cargo
# tree via winit; this only adds the Registry feature edge.
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }

# Local iced overlay (generated by `make setup-iced`, reached through the
# gitignored `target/` symlink): upstream iced at our pinned rev +
# deps/iced-raw-handle.patch, which adds window::raw_handle() so the
# Wayland DnD side-channel can reach the wl_display/wl_surface.
[patch."https://github.com/iced-rs/iced"]
iced = { path = "target/iced-overlay" }

# Local softbuffer overlay (generated by `make setup-softbuffer`, reached
# through the gitignored `target/` symlink): softbuffer 0.4.8 +
# deps/softbuffer-argb.patch, which switches the Wayland shm buffer from
# Xrgb8888 to Argb8888 so the tiny-skia (software) compositor can present
# the translucent Win8.1 border — with Xrgb8888 the alpha never reaches
# the compositor in cpu-render mode.
[patch.crates-io]
softbuffer = { path = "target/softbuffer-overlay" }

[profile.release]
opt-level = 2
debug = false
strip = "symbols"
panic = "abort"
# codegen-units = 1
# lto = true
