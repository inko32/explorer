[package]
name = "explorer"
version = "0.1.0"
edition = "2024"
description = "Windows 8 style file explorer for POSIX/Windows — iced spike"
license = "MIT"

[features]
# Embed Segoe UI in the binary (assets/fonts/segoeui.ttf). Default: off
# (system fonts only). `make build FEATURES=embed-segoe`.
embed-segoe = []

[dependencies]
iced = { git = "https://github.com/iced-rs/iced", rev = "cd04b74ca7073766f654535d6e72c452ef749d07", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "crisp", "thread-pool", "svg", "image", "advanced"] } # wgpu primary + tiny-skia fallback (D17); pick at runtime via --render
# 2026.10.25 iced git
gio  = "0.22"  # GIO backend for the VFS (local fs, volumes, trash)
glib = "0.22"  # gio companion
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"  # ribbon.yaml parsing (D12)
libloading = "0.9"  # dlopen 7z.so for the native archive backend (D16)
fontdb = "0.23"  # system font probing for the fonts.yaml fallback list (already in the tree via cosmic-text)

[profile.release]
opt-level = 2
debug = false
strip = "symbols"
codegen-units = 1
lto = true
