[package]
name = "explorer"
version = "0.1.0"
edition = "2021"
description = "Windows 8 style file explorer for POSIX/Windows — iced spike"
license = "MIT"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "wayland", "crisp", "thread-pool", "svg"] }

[profile.release]
opt-level = 2
debug = false
strip = "symbols"
