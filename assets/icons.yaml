# Icon themes (D14): the theme selector AND the internal-name registry.
#
# `theme:` picks the active icon pack at startup; the View-tab
# "Breeze icons" toggle switches between `explorer` and the system
# theme at runtime.
#
# Entry kinds (a pack entry is exactly one of):
#   svg: builtin   skin-colored SVG template, one file per icon in
#                  assets/icons/svgs/ ({fg} {bg} {subtle} {folder}
#                  {folder_edge} {hover} {title} tokens). Templates may
#                  keep design colors literal. The value slot is
#                  reserved for future per-icon asset paths, so any SVG
#                  file can join the pack without a format change.
#   file: <name>   raster asset slot (reserved; no raster assets ship
#                  today — the pack is all-SVG). Kept so a pack can
#                  take PNG/WebP/... later without a format change.
#   icon: <name>   freedesktop icon-theme name for a SYSTEM pack
#                  (freedesktop lookup, e.g. /usr/share/icons/breeze
#                  with its Inherits chain); resolves to whatever the
#                  theme ships — SVG or PNG.
#
# NO FALLBACK between packs: the active pack stands alone. An icon the
# pack cannot produce (no entry, theme lookup miss, missing asset)
# renders as a solid circle — extend the pack's map explicitly instead.
#
# The explorer pack list is grouped: UI icons first (ribbon commands,
# status bar, favorites/nav pane, window chrome — these are the
# "special" non-mime icons), then the item/mime icons (to be refined
# later). Keep the groups when adding entries.
#
# A user file at ~/.config/explorer/icons.yaml overrides `theme:` and
# any entry (same shape; `theme:` may also name a system theme
# installed under /usr/share/icons, e.g. `breeze-dark`).

theme: explorer

themes:
  explorer:
    icons:
      # === UI icons (non-mime) =====================================
      # --- ribbon command icons: every `image:` name of ribbon.yaml
      # Clipboard
      paste:          { svg: builtin }
      cut:            { svg: builtin }
      copy:           { svg: builtin }
      copy_path:      { svg: builtin }
      paste_shortcut: { svg: builtin }
      paste_special:  { svg: builtin }
      move_to:        { svg: builtin }
      copy_to:        { svg: builtin }
      delete:         { svg: builtin }
      rename:         { svg: builtin }
      # Organize
      undo:           { svg: builtin }
      redo:           { svg: builtin }
      new_folder:     { svg: builtin }
      new_item:       { svg: builtin }
      new:            { svg: builtin }
      easy_access:    { svg: builtin }
      properties:     { svg: builtin }
      open:           { svg: builtin }
      edit:           { svg: builtin }
      history:        { svg: builtin }
      # Select
      select_all:     { svg: builtin }
      select_none:    { svg: builtin }
      invert_sel:     { svg: builtin }
      # Share / find
      share:          { svg: builtin }
      email:          { svg: builtin }
      pin:            { svg: builtin }
      find:           { svg: builtin }
      # View
      view_details:   { svg: builtin }
      view_large:     { svg: builtin }
      view_list:      { svg: builtin }
      view_tiles:     { svg: builtin }
      sort_by:        { svg: builtin }
      nav_pane:       { svg: builtin }
      preview_pane:   { svg: builtin }
      details_pane:   { svg: builtin }
      # System
      save:           { svg: builtin }
      print:          { svg: builtin }
      terminal:       { svg: builtin }
      extract:        { svg: builtin }
      exit:           { svg: builtin }
      gear:           { svg: builtin }
      # --- status bar: the view-mode buttons (also the ribbon View
      # tab — view_details / view_large are shared, listed above)
      # --- favorites / nav pane: favorites() entries + section
      # header (star) and the This PC tree
      home:           { svg: builtin }
      desktop:        { svg: builtin }
      documents:      { svg: builtin }
      downloads:      { svg: builtin }
      pictures:       { svg: builtin }
      music:          { svg: builtin }
      videos:         { svg: builtin }
      recent:         { svg: builtin }
      star:           { svg: builtin }
      computer:       { svg: builtin }
      libraries:      { svg: builtin }
      network:        { svg: builtin }
      drive:          { svg: builtin }
      # --- window / navigation chrome (title bar, address bar)
      back:           { svg: builtin }
      forward:        { svg: builtin }
      up:             { svg: builtin }
      refresh:        { svg: builtin }
      search:         { svg: builtin }
      chevron_down:   { svg: builtin }
      chevron_right:  { svg: builtin }
      help:           { svg: builtin }
      # window caption buttons (_ [] X) are hard-coded window chrome in
      # src/border.rs (the D14 exception), not pack icons; `close` stays
      # in the pack for general UI use (e.g. the ribbon's Close search)
      close:          { svg: builtin }

      # === items (mime) — refined later ============================
      folder:         { svg: builtin }
      file:           { svg: builtin }
      file_image:     { svg: builtin }
      text:           { svg: builtin }
      zip:            { svg: builtin }
      archive:        { svg: builtin }
      audio:          { svg: builtin }
      video:          { svg: builtin }
      exe:            { svg: builtin }
      disc:           { svg: builtin }
      png:            { svg: builtin }

  # freedesktop names as shipped by /usr/share/icons/breeze — verified
  # against the theme; unmapped internal names fall back to explorer.
  breeze:
    icons:
      # ribbon command icons
      paste:          { icon: edit-paste }
      cut:            { icon: edit-cut }
      copy:           { icon: edit-copy }
      copy_path:      { icon: edit-copy-path }
      paste_shortcut: { icon: edit-link }
      paste_special:  { svg: builtin }      # no freedesktop equivalent
      move_to:        { icon: edit-move }
      copy_to:        { icon: edit-copy }
      delete:         { icon: edit-delete }
      rename:         { icon: edit-rename }
      undo:           { icon: edit-undo }
      redo:           { icon: edit-redo }
      new_folder:     { icon: folder-new }
      new_item:       { icon: document-new }
      new:            { icon: document-new }
      easy_access:    { svg: builtin }      # no freedesktop equivalent
      properties:     { icon: document-properties }
      open:           { icon: document-open }
      edit:           { icon: document-edit }
      history:        { icon: document-open-recent }
      select_all:     { icon: edit-select-all }
      select_none:    { icon: edit-select-none }
      invert_sel:     { icon: edit-select-invert }
      share:          { icon: document-share }
      email:          { icon: mail-send }
      pin:            { icon: pin }
      find:           { icon: system-search }
      view_details:   { icon: view-list-details }
      view_large:     { icon: view-preview }
      view_list:      { icon: view-list-text }
      view_tiles:     { icon: view-grid }
      sort_by:        { icon: view-sort-ascending }
      nav_pane:       { svg: builtin }      # no freedesktop equivalent
      preview_pane:   { icon: fileview-preview }
      details_pane:   { icon: view-list-details }
      print:          { icon: document-print }
      terminal:       { icon: utilities-terminal }
      extract:        { icon: archive-extract }
      exit:           { icon: application-exit }
      gear:           { icon: configure }
      # status bar (view_details / view_large shared, listed above)
      # favorites / nav pane
      home:           { icon: user-home }
      desktop:        { icon: user-desktop }
      documents:      { icon: folder-documents }
      downloads:      { icon: folder-download }
      pictures:       { icon: folder-pictures }
      music:          { icon: folder-music }
      videos:         { icon: folder-videos }
      recent:         { icon: document-open-recent }
      star:           { icon: favorites }
      computer:       { icon: computer }
      libraries:      { icon: folder-documents }
      network:        { icon: network-workgroup }
      drive:          { icon: drive-harddisk }
      # window / navigation chrome
      back:           { icon: go-previous }
      forward:        { icon: go-next }
      up:             { icon: go-up }
      refresh:        { icon: view-refresh }
      search:         { icon: system-search }
      chevron_down:   { icon: go-down }
      chevron_right:  { icon: go-next }
      help:           { icon: help-contents }
      close:          { icon: window-close }
      # items (mime)
