  home:         { svg: builtin }
  desktop:      { svg: builtin }
  documents:    { svg: builtin }
  downloads:    { svg: builtin }
  pictures:     { svg: builtin }
  music:        { svg: builtin }
  videos:       { svg: builtin }
  recent:       { svg: builtin }
