# Theme tokens — the single source of truth for every color in the app.
#
# Parsed by src/theme.rs at startup. A complete copy at
# ~/.config/explorer/theme.yaml overrides the embedded one (same
# override pattern as ribbon.yaml); a broken override is reported on
# stderr and the embedded theme is used.
#
# Colors are sRGB hex strings: "#RRGGBB" or "#RRGGBBAA" (alpha last,
# the leading '#' is optional).
#
# Border widths and the DPI: when border_follow_dpi is 0/false (the
# default), every border element keeps a constant PHYSICAL width (a
# "1px" border is 1 physical pixel at any UI scale); when 1/true,
# borders scale with the DPI like everything else. See
# SPEC/Border_DPI.md.
border_follow_dpi: 0

# Fade-out duration (milliseconds) for ribbon popups when the window
# loses focus (SPEC/Unfocused_Window.md). 0 = close instantly. Kept as
# a general animation token; future fades should reuse it.
fade_ms: 300
#
# Token names follow SPEC/File_Operation_UI_Spec.md §2 where a mapping
# exists (commented per group); app-specific chrome keeps its own names.
# The `dialog` and `state` groups are not consumed by any view yet —
# they are the palette the future file-operation dialogs (D1-D6) draw
# from, so their values come straight from the spec.

light:
  # ---- accent & selection (spec: accent.*, accent.tint.*) ----
  accent: "#6BADF6"          # chrome accent (tab underline, focus, links)
  accent_dark: "#368BE9"     # deeper accent (pressed, gradients)
  sel: "#CCE8FF"             # list selection fill (spec: accent.tint.selected)
  sel_border: "#1979CA"      # list selection border
  sel_inactive: "#E5E5E5"    # selection fill, window unfocused (SPEC/Unfocused_Window.md)
  sel_inactive_border: "#D9D9D9" # selection border, window unfocused

  # ---- surfaces (spec: surface.*) ----
  window_bg: "#FFFFFF"       # spec: surface.content
  ribbon_bg: "#F5F6F7"       # ribbon command pane
  nav_bg: "#FFFFFF"          # nav pane background
  toolbar_bg: "#FFFFFF"      # address bar / search rows
  status_bg: "#FFFFFF"       # status bar
  col_header_bg: "#F7F7F7"   # folder view column header
  menu_bg: "#FBFCFD"         # dropdown / context menu (spec: surface.menu)
  menu_border: "#DCDDDE"
  menu_section_border: "#D9DADB"

  # ---- text (spec: text.*) ----
  text: "#1A1A1A"            # spec: text.primary
  subtle: "#494949"          # spec: text.secondary
  disabled: "#A0A0A0"        # spec: text.disabled
  title_text: "#1A1A1A"      # title-bar caption text
  titlebar_inactive: "#C8C8C8"

  # ---- interaction states ----
  hover: "#E5F3FF"           # list row hover (spec: accent.tint.hover)
  pressed: "#A4CEF9"         # pressed list row
  hover_btn: "#E8EFF7"       # ribbon command hover fill
  hover_btn_border: "#A4CEF9"
  sel_btn: "#C9E0F7"         # checked/pressed ribbon button fill
  sel_btn_border: "#62A2E4"
  nav_hover: "#E5F3FB"       # circular nav-button hover fill
  nav_hover_border: "#70C0E7"
  nav_grey: "#D9D9D9"        # breadcrumb text fill while its arrow is hovered
  plate_hover: "#CBECFD"     # color-plate swatch hover fill
  plate_hover_border: "#64A5E7"
  search_btn_bg: "#E8F1FB"   # recessed search-box button fill
  search_btn_border: "#A9C4E8"
  file_tab: "#1979CA"        # File menu tab
  file_tab_hover: "#2B87D8"
  tab_hover_outline: "#EBECED"

  # ---- separators & borders (spec: divider, frame.border) ----
  sep: "#DADBDC"             # main separator lines
  group_sep: "#E2E3E4"       # group separator (lighter than sep)
  nav_border: "#D9D9D9"      # nav crumb bar / search box border
  address_border: "#A9A9A9"

  # ---- caption buttons ----
  close_idle: "#C20E1C"      # Win8: solid red at rest
  close_hover: "#E81123"
  close_pressed: "#8F0A15"

  # ---- title bar glass overlays ----
  glass_ghost: "#FFFFFF2E"   # minimize/maximize caption ghost (18% white)
  glass_sheen: "#FFFFFF59"   # QAT separator sheen (35% white)

  # ---- icons ----
  folder: "#F6C356"          # folder icon fill
  folder_edge: "#C88E1E"     # folder icon edge shading

  # ---- ribbon chrome ----
  # Only ribbon-specific values live here; the builder in
  # ribbon/mod.rs::theme() derives the rest from the shared tokens
  # (tab strip = window_bg, ribbon body = ribbon_bg, menu popups =
  # menu_bg, group separators = group_sep, ...).
  ribbon:
    accent: "#2673EC"        # ribbon's own accent (checked, orb, selection)
    accent_dark: "#2673EC"   # orb gradient bottom
    text: "#333333"          # ribbon label text
    tab_text: "#444444"
    border: "#CCCCCC"        # button frames / popup border
    tab_line: "#D0D0D0"      # tab-bar hairline
    tooltip_border: "#999999"
    group_label: "#666666"
    text_disabled: "#A6A6A6"
    keytip_bg: "#3B3B3B"
    keytip_text: "#FFFFFF"

  # ---- dialog tokens (spec §2.5; for dialogs D1-D6, unused yet) ----
  dialog:
    surface_dialog: "#F0F0F0"      # spec: surface.dialog
    divider: "#E3E3E3"             # spec: divider
    button_fill: "#FDFDFD"         # spec: button.fill
    button_border: "#D0D0D0"       # spec: button.border
    button_border_bottom: "#BABABA" # spec: button.border.bottom
    textbox_fill: "#FFFFFF"        # spec: textbox.fill
    textbox_border: "#ECECEC"      # spec: textbox.border
    tooltip_fill: "#F9F9F9"        # spec: tooltip.fill
    tooltip_border: "#CCCCCC"      # spec: tooltip.border
    focus_stroke: "#000000"        # spec: focus.stroke
    checkbox_border: "#626262"     # spec: checkbox.border
    checkbox_fill: "#F3F3F3"       # spec: checkbox.fill

  # ---- semantic state colors (spec §2.7; not accent-derived) ----
  state:
    progress_fill: "#0F7B0F"       # progressing (green)
    paused_fill: "#8F6E00"         # paused (amber)
    error_fill: "#C42B1C"          # error (red)
    warning_icon: "#FFC200"        # warning triangle (both themes)

