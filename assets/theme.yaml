  hover: "#3A4046"
  pressed: "#4A525A"
  hover_btn: "#3A4046"
  hover_btn_border: "#4A90D9"
  sel_btn: "#3D5A78"
  sel_btn_border: "#5A89C0"
  nav_hover: "#3A4046"
  nav_hover_border: "#4A90D9"
  nav_grey: "#4A4A4A"
  file_tab: "#1979CA"
  file_tab_hover: "#2B87D8"
  sel: "#2F5480"
  sel_border: "#4A90D9"
  sel_inactive: "#3A3A3A"    # selection fill, window unfocused (SPEC/Unfocused_Window.md)
  sel_inactive_border: "#4A4A4A" # selection border, window unfocused
  sep: "#454545"
  group_sep: "#505050"
  text: "#E8E8E8"
  subtle: "#A0A0A0"
  disabled: "#6E6E6E"
  folder: "#C89B3C"
  folder_edge: "#8A6618"
  close_hover: "#E81123"
  close_idle: "#A50D19"
  close_pressed: "#6E080F"
  tab_hover_outline: "#4A4A4A"
  nav_border: "#555555"
  search_btn_bg: "#2E3F55"
  search_btn_border: "#46647F"
  menu_bg: "#383838"
  menu_border: "#505050"
  menu_section_border: "#505050"
  plate_hover: "#3A506E"
