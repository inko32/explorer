# Ribbon definition — explorer markup for the rs-ribbon framework
# (the YAML equivalent of Windows ribbon `.ribbon` XML resources; schema
# documented in src/ribbon/spec.rs).
#
# The COMMANDING layer lives in src/ribbon/mod.rs: every `commands:` name
# maps to a numeric id, and ExplorerHandler dispatches executions to
# explorer actions. Contextual tabs are governed by UI_PKEY_ContextAvailable,
# published from the explorer context (is_drive / has_image / inside_archive
# / has_archive). Tabs whose detector is not wired yet return
# ContextAvailable=NotAvailable so they stay hidden (see mod.rs).
#
# Structure mirrors the real Windows 10 File Explorer ribbon
# (SPEC/RIBBON-LIST.TXT). Custom explorer-only commands that have no Win10
# equivalent are kept on purpose: dark mode, custom border, Win8 frame,
# open terminal, paste symbolic link, delete as sudo, filters, tree expander.

# How unavailable (disabled) buttons look:
#   faded             - dimmed by opacity only (the classic look)
#   gray_scaled_faded - desaturated (grayscale icon) plus the dim
# Toggleable at runtime from the View tab ("Gray disabled" button);
# the button starts checked when this setting is gray_scaled_faded.
disabled_style: faded

# When the window is unfocused the ribbon goes inert: it ignores all
# input and shows no hover visuals (CPU saving,
# SPEC/Unfocused_Window.md). The gray fade of checked buttons is part
# of the theme and always applies.
ignore_input_when_unfocused: true

