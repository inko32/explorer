# Ribbon definition — the ribbon is DATA, not code (docs/ribbon-details.txt).
# Edit this file to add/remove tabs, groups, buttons, contextual tabs.
#
# Widths are AUTOMATIC: buttons size from their icon + label, groups from
# their content. If you ever need to force a size, `width: <px>` is still
# accepted on any command or group as a manual override.
#
# A command is either:
#   internal: <name>   → mapped to an internal action (see src/ribbon.rs)
#   shell: "<script>"  → run via `sh -c` (always sh -c, never a bare binary,
#                        for future Windows migration). Placeholders:
#                        {cwd} {selection} {selection_count}
#
# Contextual tabs appear when their `when` expression matches the context
# { cwd, selection }. Predicates: is_drive, inside_archive, has_archive,
# has_image, has_video, has_audio, has_selection, is_empty. Combine with
# and/or/not and parentheses.

tabs:
  - id: file
    label: File
    kind: file
  - id: home
    label: Home
    groups:
      - label: Clipboard
        rows: 3
        commands:
          - { id: paste, label: Paste, icon: paste, size: big }
          - { id: cut, label: Cut, icon: cut, size: small }
          - { id: copy, label: Copy, icon: copy, size: small }
          - { id: copy_path, label: Copy path, icon: copy_path, size: small, enabled: false }
          - { id: paste_shortcut, label: Paste shortcut, icon: paste_shortcut, size: small, enabled: false }
      - label: Organize
        commands:
          - { id: move_to, label: Move to, icon: move_to, size: big, dropdown: [move_to_home, move_to_desktop] }
          - { id: copy_to, label: Copy to, icon: copy_to, size: big, dropdown: [copy_to_home, copy_to_desktop] }
          - { separator: true }
          - { id: delete, label: Delete, icon: delete, size: big, dropdown: [delete_permanently] }
          - { id: rename, label: Rename, icon: rename, size: big }
      - label: New
        commands:
          - { id: new_folder, label: New folder, icon: new_folder, size: big }
          - { id: new_item, label: New item, icon: new_item, size: small, enabled: false }
          - { id: easy_access, label: Easy access, icon: easy_access, size: small, enabled: false }
      - label: Open
        commands:
          - { id: properties, label: Properties, icon: properties, size: big, enabled: false }
          - { id: open, label: Open, icon: open, size: small, enabled: false }
          - { id: edit, label: Edit, icon: edit, size: small, enabled: false }
          - { id: history, label: History, icon: history, size: small, enabled: false }
      - label: Select
        commands:
          - { id: select_all, label: Select all, icon: select_all, size: small }
          - { id: select_none, label: Select none, icon: select_none, size: small }
          - { id: invert_selection, label: Invert selection, icon: invert_sel, size: small }
  - id: share
    label: Share
    groups:
      - label: Share with
        commands:
          - { id: share_nobody, label: Nobody, icon: properties, size: small, enabled: false }
      - label: Send
        commands:
          - { id: share_email, label: Email, icon: copy_to, size: small, enabled: false }
  - id: view
    label: View
    groups:
      - label: Panes
        rows: 2
        commands:
          - { id: toggle_nav, label: Navigation pane, icon: nav_pane, size: big, enabled: false, dropdown: [toggle_preview, toggle_details_pane] }
          - { id: toggle_preview, label: Preview pane, icon: preview_pane, size: small, enabled: false }
          - { id: toggle_details_pane, label: Details pane, icon: details_pane, size: small, enabled: false }
      - label: Layout
        kind: gallery
        rows: 3
        commands:
          - { id: view_xl, label: Extra large icons, icon: view_large, size: small, enabled: false }
          - { id: view_large, label: Large icons, icon: view_large, size: small }
          - { id: view_medium, label: Medium icons, icon: view_large, size: small, enabled: false }
          - { id: view_small, label: Small icons, icon: view_details, size: small, enabled: false }
          - { id: view_list, label: List, icon: view_details, size: small, enabled: false }
          - { id: view_details, label: Details, icon: view_details, size: small }
          - { id: view_tiles, label: Tiles, icon: view_large, size: small, enabled: false }
          - { id: view_content, label: Content, icon: view_details, size: small, enabled: false }
      - label: Current view
        rows: 3
        commands:
          - { id: sort_by, label: Sort by, icon: sort_by, size: big, dropdown: [sort_name, sort_size, sort_modified] }
          - { id: group_by, label: Group by, icon: sort_by, size: small, enabled: false }
          - { id: size_columns, label: Size columns to fit, icon: view_details, size: small, enabled: false }
      - label: Show/hide
        rows: 3
        commands:
          - { id: toggle_checkboxes, label: Item check boxes, kind: checkbox, enabled: false }
          - { id: toggle_extensions, label: File name extensions, kind: checkbox, enabled: false }
          - { id: toggle_hidden, label: Hidden items, kind: checkbox }
      - label: Options
        rows: 2
        commands:
          - { id: toggle_dark, label: Dark mode, kind: checkbox }
          - { id: toggle_border, label: Custom border, kind: checkbox }
          - { id: toggle_frame, label: Win8 frame, icon: gear, size: small }
          - { id: folder_options, label: Folder options, icon: gear, size: small, enabled: false }

contextual_tabs:
  - id: drive_tools
    label: Drive Tools
    color: green
    when: "is_drive"
    groups:
      - label: Drive
        commands:
          - { id: drive_properties, label: Properties, icon: properties, size: small, enabled: false }
          - { id: open_terminal, label: Open terminal, icon: gear, size: small }
  - id: picture_tools
    label: Picture Tools
    color: gold
    when: "has_image"
    groups:
      - label: Manage
        commands:
          - { id: open_picture, label: Open, icon: open, size: small }
          - { id: set_wallpaper, label: Set as wallpaper, icon: pictures, size: small, enabled: false }
  - id: archive_tools
    label: Archive Tools
    color: orange
    when: "inside_archive or has_archive"
    activate_when: "inside_archive"
    groups:
      - label: Archive
        commands:
          - { id: extract_here, label: Extract here, icon: copy_to, size: small, enabled: false }
          - { id: open_terminal, label: Open terminal, icon: gear, size: small }

commands:
  paste: { internal: paste }
  cut: { internal: cut }
  copy: { internal: copy }
  delete: { internal: delete }
  delete_permanently: { label: Delete permanently, internal: delete_permanent }
  move_to_home: { label: Home, internal: "move_to:~/" }
  move_to_desktop: { label: Desktop, internal: "move_to:~/Desktop" }
  copy_to_home: { label: Home, internal: "copy_to:~/" }
  copy_to_desktop: { label: Desktop, internal: "copy_to:~/Desktop" }
  sort_name: { label: Name, internal: sort_name }
  sort_size: { label: Size, internal: sort_size }
  sort_modified: { label: Date modified, internal: sort_modified }
  rename: { internal: rename }
  new_folder: { internal: new_folder }
  select_all: { internal: select_all }
  select_none: { internal: select_none }
  invert_selection: { internal: invert_selection }
  view_large: { internal: view_large }
  view_details: { internal: view_details }
  toggle_hidden: { internal: toggle_hidden }
  toggle_dark: { internal: toggle_dark }
  toggle_border: { internal: toggle_border }
  toggle_frame: { internal: toggle_frame }
  open_picture: { internal: open }
  open_terminal:
    shell: "konsole --workdir {cwd}"
