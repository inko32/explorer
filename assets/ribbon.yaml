                 cmdEasyAccess, cmdOpenWith, cmdEdit, cmdHistory,
                 cmdPreviewPane, cmdDetailsPane, cmdExpandToFolder,
                 cmdShowAllFolders, cmdGroupBy, cmdAddColumns, cmdSizeColumns,
                 cmdToggleCheckboxes, cmdToggleExtensions, cmdToggleHidden,
                 cmdShowTreeExpander, cmdToggleDark, cmdToggleBorder,
                 cmdToggleFrame, cmdChangeFolderOptions, cmdReadOnly,
                 cmdBitlocker, cmdBitlockerOn, cmdBitlockerManage, cmdBitlockerPin,
                 cmdOptimize, cmdCleanup, cmdFormat, cmdAutoPlay, cmdEject,
                 cmdFinishBurning, cmdEraseDisc, cmdRotateLeft, cmdRotateRight,
                 cmdSlideShow, cmdCurrentFolder, cmdAllSubfolders,
                 cmdSearchAgainIn, cmdDateModified, cmdKind, cmdSizeFilter,
                 cmdOtherProperties, cmdRecentSearches, cmdAdvancedOptions,
                 cmdSaveSearch, cmdOpenFileLocation, cmdCloseSearch,
                 cmdPlay, cmdPlayAll, cmdAddToPlaylist, cmdPinTaskbar,
                 cmdRunAsAdmin, cmdRunAsUser, cmdTroubleshoot, cmdMount,
                 cmdNetOpen, cmdRemoteDesktop, cmdAddDevices, cmdViewPrinters,
                 cmdDeviceWebpage, cmdSearchAD, cmdNetSharingCenter,
                 cmdCompOpen, cmdAccessMedia, cmdConnectMedia,
                 cmdDisconnectMedia, cmdMapNetworkDrive, cmdDisconnectDrive,
                 cmdAddNetworkLocation, cmdUninstallProgram, cmdSystemProperties,
                 cmdBurn, cmdPrint, cmdFax, cmdUserList, cmdFilterAll,
                 cmdFilterDocs, cmdFilterSheets, cmdFilterSlides, cmdFilterImages,
                 cmdFilterVideos, cmdFilterPdf, cmdZip, cmdSevenZ, cmdTarXz]
      size: small
  mediumish:
    - controls: [cmdPaste, cmdMoveTo, cmdCopyTo, cmdDelete, cmdRename,
                 cmdProperties, cmdSortBy, cmdFilters, cmdCompress,
                 cmdRemoveAccess, cmdAdvancedSecurity, cmdHideSelected,
                 cmdBitlocker, cmdAutoPlay, cmdSlideShow, cmdExtractAll,
                 cmdDateModified, cmdSearchAgainIn, cmdRunAsAdmin,
                 cmdMapNetworkDrive, cmdNetProperties, cmdCompProperties]
      size: medium

