# Ribbon definition — the ribbon is DATA, not code (docs/ribbon-details.txt).
# Edit this file to add/remove tabs, groups, buttons, contextual tabs.
#
# A command is either:
#   internal: <name>   → mapped to an internal action (see src/ribbon.rs)
#   shell: "<script>"  → run via `sh -c` (always sh -c, never a bare binary,
#                        for future Windows migration). Placeholders:
#                        {cwd} {selection} {selection_count}
#
# Contextual tabs appear when their `when` expression matches the context
# { cwd, selection }. Predicates: is_drive, inside_archive, has_archive,
# has_image, has_video, has_audio, has_selection, is_empty. Combine with
# and/or/not and parentheses.

tabs:
  - id: file
    label: File
    kind: file
  - id: home
    label: Home
    groups:
      - label: Clipboard
        width: 160
        commands:
          - { id: paste, label: Paste, icon: paste, size: big }
          - { id: cut, label: Cut, icon: cut, size: small }
          - { id: copy, label: Copy, icon: copy, size: small }
          - { id: copy_path, label: Copy path, icon: copy_path, size: small, enabled: false }
          - { id: paste_shortcut, label: Paste shortcut, icon: paste_shortcut, size: small, enabled: false }
      - label: Organize
        width: 210
        columns: 2
        commands:
          - { id: move_to, label: Move to, icon: move_to, size: small, enabled: false }
          - { id: copy_to, label: Copy to, icon: copy_to, size: small, enabled: false }
          - { id: delete, label: Delete, icon: delete, size: small }
          - { id: rename, label: Rename, icon: rename, size: small }
      - label: New
        width: 148
        commands:
          - { id: new_folder, label: New folder, icon: new_folder, size: big }
          - { id: new_item, label: New item, icon: new_item, size: small, enabled: false }
          - { id: easy_access, label: Easy access, icon: easy_access, size: small, enabled: false }
      - label: Open
        width: 132
        commands:
          - { id: properties, label: Properties, icon: properties, size: big, enabled: false }
          - { id: open, label: Open, icon: open, size: small, enabled: false }
          - { id: edit, label: Edit, icon: edit, size: small, enabled: false }
          - { id: history, label: History, icon: history, size: small, enabled: false }
      - label: Select
        width: 116
        commands:
          - { id: select_all, label: Select all, icon: select_all, size: small }
          - { id: select_none, label: Select none, icon: select_none, size: small }
          - { id: invert_selection, label: Invert selection, icon: invert_sel, size: small }
  - id: share
    label: Share
    groups:
      - label: Share with
        width: 100
        commands:
          - { id: share_nobody, label: Nobody, icon: properties, size: small, enabled: false }
      - label: Send
        width: 100
        commands:
          - { id: share_email, label: Email, icon: copy_to, size: small, enabled: false }
  - id: view
    label: View
    groups:
      - label: Layout
        width: 100
        commands:
          - { id: view_large, label: Large icons, icon: view_large, size: small }
          - { id: view_details, label: Details, icon: view_details, size: small }
      - label: Show/hide
        width: 110
        commands:
          - { id: toggle_nav, label: Navigation pane, icon: computer, size: small, enabled: false }
          - { id: toggle_hidden, label: Hidden items, icon: file, size: small }
      - label: Options
        width: 100
        commands:
          - { id: toggle_dark, label: Dark mode, icon: gear, size: small }
          - { id: folder_options, label: Folder options, icon: gear, size: small, enabled: false }

contextual_tabs:
  - id: drive_tools
    label: Drive Tools
    when: "is_drive"
    groups:
      - label: Drive
        width: 110
        commands:
          - { id: drive_properties, label: Properties, icon: properties, size: small, enabled: false }
          - { id: open_terminal, label: Open terminal, icon: gear, size: small }
  - id: picture_tools
    label: Picture Tools
    when: "has_image"
    groups:
      - label: Manage
        width: 110
        commands:
          - { id: open_picture, label: Open, icon: open, size: small }
          - { id: set_wallpaper, label: Set as wallpaper, icon: pictures, size: small, enabled: false }
  - id: archive_tools
    label: Archive Tools
    when: "inside_archive or has_archive"
    groups:
      - label: Archive
        width: 110
        commands:
          - { id: extract_here, label: Extract here, icon: copy_to, size: small, enabled: false }
          - { id: open_terminal, label: Open terminal, icon: gear, size: small }

commands:
  paste: { internal: paste }
  cut: { internal: cut }
  copy: { internal: copy }
  delete: { internal: delete }
  rename: { internal: rename }
  new_folder: { internal: new_folder }
  select_all: { internal: select_all }
  select_none: { internal: select_none }
  invert_selection: { internal: invert_selection }
  view_large: { internal: view_large }
  view_details: { internal: view_details }
  toggle_hidden: { internal: toggle_hidden }
  toggle_dark: { internal: toggle_dark }
  open_picture: { internal: open }
  open_terminal:
    shell: "konsole --workdir {cwd}"
