tabs:
  # ============================================================ Home
  - id: home
    label: Home
    keytip: "H"
    groups:
      - id: clipboard
        label: Clipboard
        image: paste
        controls:
          - { type: button, command: cmdPin, size: large, image: pin, label: Pin to Quick access, keytip: "P", tooltip: "Pin the current folder to Quick access" }
          - { type: button, command: cmdCopy, size: large, image: copy, label: Copy, keytip: "C", tooltip: "Copy the selection to the clipboard", shortcut: "Ctrl+C" }
          - type: split_button
            command: cmdPaste
            separate: true
            size: large
            image: paste
            label: Paste
            keytip: "V"
            tooltip: "Paste the clipboard contents here"
            shortcut: "Ctrl+V"
            items:
              - { command: cmdPasteSpecial, image: paste_special, label: Paste special }
          - { type: button, command: cmdCut, size: small, image: cut, label: Cut, keytip: "X", tooltip: "Cut the selection to the clipboard", shortcut: "Ctrl+X" }
          - { type: button, command: cmdCopyPath, size: small, image: copy, label: Copy path, tooltip: "Copy the selected path to the clipboard" }
          - type: split_button
            command: cmdPasteShortcut
            size: small
            image: paste_special
            label: Paste shortcut
            items:
              - { command: cmdPasteShortcut, image: paste_special, label: Paste shortcut }
              - { command: cmdPasteSymlink, image: paste_special, label: Paste symbolic link }

      - id: organize
        label: Organize
        image: copy_to
        controls:
          - type: split_button
            command: cmdMoveTo
            size: large
            image: move_to
            label: Move to
            keytip: "M"
            items:
              - { command: cmdMoveToHome, image: open, label: Home }
              - { command: cmdMoveToDesktop, image: open, label: Desktop }
          - type: split_button
            command: cmdCopyTo
            size: large
            image: copy_to
            label: Copy to
            keytip: "Y"
            items:
              - { command: cmdCopyToHome, image: open, label: Home }
              - { command: cmdCopyToDesktop, image: open, label: Desktop }
          - type: split_button
            command: cmdDelete
            separate: true
            size: large
            image: delete
            label: Delete
            keytip: "D"
            tooltip: "Move the selection to the trash"
            shortcut: "Del"
            items:
              - { command: cmdDelete, image: delete, label: Recycle, tooltip: "Move the selection to the trash" }
              - { command: cmdDeletePermanent, image: delete, label: Delete permanently, tooltip: "Permanently delete the selection" }
              - { command: cmdDeleteSudo, image: terminal, label: Delete as sudo, tooltip: "Delete as root (sudo)" }
              - { command: cmdShowRecycleConfirm, image: gear, label: Show recycle confirmation }
          - { type: button, command: cmdRename, size: large, image: rename, label: Rename, keytip: "N", tooltip: "Rename the selected item", shortcut: "F2" }

      - id: new
        label: New
        image: new_folder
        controls:
          - { type: button, command: cmdNewFolder, size: large, image: new_folder, label: New folder, keytip: "W", tooltip: "Create a new folder here", shortcut: "Ctrl+Shift+N" }
          - type: split_button
            command: cmdNewItem
            size: small
            image: new
            label: New item
            items:
              - { command: cmdNewFolder, image: new_folder, label: Folder }
              - { command: cmdNewShortcut, image: new, label: Shortcut }
              - { command: cmdNewSymlink, image: new, label: Symbolic link }
              - { command: cmdNewTextFile, image: new, label: Text file }
          - type: split_button
            command: cmdEasyAccess
            size: small
            image: gear
            label: Easy access
            items:
              - { command: cmdMapDrive, image: open, label: Map as drive }
              - { command: cmdShareAccess, image: email, label: Share }

      - id: open
        label: Open
        image: properties
        controls:
          - type: split_button
            command: cmdProperties
            size: large
            image: properties
            label: Properties
            keytip: "I"
            items:
              - { command: cmdProperties, image: properties, label: Properties }
              - { command: cmdRemoveProperties, image: properties, label: Remove properties }
              - { command: cmdPermission, image: gear, label: Permission }
              - { command: cmdMakeExecutable, image: terminal, label: Make executable }
              - { command: cmdGrantPermission, image: gear, label: Grant permission }
          - type: split_button
            command: cmdOpenWith
            size: small
            image: open
            label: Open
            items:
              - { command: cmdOpenNotepad, image: blank, label: Notepad }
              - { command: cmdOpenExcel, image: blank, label: Excel }
              - { command: cmdOpenWord, image: blank, label: Word }
              - { command: cmdChooseApp, image: open, label: Choose another app }
          - { type: button, command: cmdEdit, size: small, image: edit, label: Edit }
          - { type: button, command: cmdHistory, size: small, image: history, label: History }

      - id: select
        label: Select
        image: select_all
        controls:
          - { type: button, command: cmdSelectAll, size: small, image: select_all, label: Select all, keytip: "SA", tooltip: "Select all items", shortcut: "Ctrl+A" }
          - { type: button, command: cmdSelectNone, size: small, image: select_none, label: Select none, tooltip: "Clear the selection" }
          - { type: button, command: cmdInvertSelection, size: small, image: invert_sel, label: Invert selection, tooltip: "Invert the selection" }

      - id: filter
        label: Filter
        image: find
        controls:
          - type: split_button
            command: cmdFilters
            size: large
            image: find
            label: Filters
            keytip: "F"
            items:
              - { command: cmdFilterAll, image: blank, label: All File Types }
              - { command: cmdFilterDocs, image: blank, label: Documents, separator_before: true }
              - { command: cmdFilterSheets, image: blank, label: Spreadsheets }
              - { command: cmdFilterSlides, image: blank, label: Slides }
              - { command: cmdFilterImages, image: blank, label: Images }
              - { command: cmdFilterVideos, image: blank, label: Videos }
              - { command: cmdFilterPdf, image: blank, label: PDF Files }

  # ============================================================ Share
  - id: share
    label: Share
    keytip: "S"
    groups:
      - id: send
        label: Send
        image: email
        controls:
          - { type: button, command: cmdShare, size: large, image: email, label: Share, tooltip: "Share the selection" }
          - { type: button, command: cmdEmail, size: large, image: email, label: Email, tooltip: "Send the selection by email" }
          - { type: button, command: cmdBurn, size: small, image: blank, label: Burn to disc }
          - { type: button, command: cmdPrint, size: small, image: print, label: Print }
          - { type: button, command: cmdFax, size: small, image: print, label: Fax }

      - id: share_with
        label: Share with
        image: properties
        controls:
          # runtime-populated user list (placeholder until gallery items source is wired)
          - { type: button, command: cmdUserList, size: small, image: blank, label: People }
          - { type: button, command: cmdRemoveAccess, size: large, image: delete, label: Remove access, tooltip: "Stop sharing the selection" }

      - id: share_security
        image: gear
        controls:
          - { type: button, command: cmdAdvancedSecurity, size: large, image: gear, label: Advanced security, tooltip: "Open advanced security settings" }

  # ============================================================ View
  - id: view
    label: View
    keytip: "W"
    groups:
      - id: panes
        label: Panes
        image: nav_pane
        controls:
          - type: split_button
            command: cmdNavPane
            size: large
            image: nav_pane
            label: Navigation pane
            keytip: "P"
            items:
              - { command: cmdNavPane, image: nav_pane, label: Navigation pane }
              - { command: cmdExpandToFolder, image: nav_pane, label: Expand to open folder, separator_before: true }
              - { command: cmdShowAllFolders, image: nav_pane, label: Show all folders }
          - { type: toggle_button, command: cmdPreviewPane, size: small, image: preview_pane, label: Preview pane }
          - { type: toggle_button, command: cmdDetailsPane, size: small, image: details_pane, label: Details pane }

      - id: layout
        label: Layout
        image: view_details
        controls:
          - { type: toggle_button, command: cmdViewDetails, size: large, image: view_details, label: Details, keytip: "D", tooltip: "Show items in a detailed list" }
          - { type: toggle_button, command: cmdViewLarge, size: large, image: view_large, label: Large icons, keytip: "L", tooltip: "Show items as large icons" }

      - id: current_view
        label: Current view
        image: sort_by
        controls:
          - type: split_button
            command: cmdSortBy
            separate: true
            size: large
            image: sort_by
            label: Sort by
            keytip: "SO"
            items:
              - { command: cmdSortName, image: sort_by, label: Name }
              - { command: cmdSortDate, image: sort_by, label: Date }
              - { command: cmdSortType, image: sort_by, label: Type }
              - { command: cmdSortSize, image: sort_by, label: Size }
              - { command: cmdSortTags, image: sort_by, label: Tags }
              - { command: cmdSortCreated, image: sort_by, label: Date created }
              - { command: cmdSortModified, image: sort_by, label: Date modified }
              - { command: cmdSortTaken, image: sort_by, label: Date taken }
              - { command: cmdSortDimensions, image: sort_by, label: Dimensions }
              - { command: cmdSortRating, image: sort_by, label: Rating }
              - { command: cmdSortAsc, image: sort_by, label: Ascending, separator_before: true }
              - { command: cmdSortDesc, image: sort_by, label: Descending }
              - { command: cmdChooseColumns, image: view_details, label: Choose columns, separator_before: true }
          - type: split_button
            command: cmdGroupBy
            size: small
            image: sort_by
            label: Group by
            items:
              - { command: cmdGroupNone, image: blank, label: "(none)" }
              - { command: cmdGroupName, image: sort_by, label: Name, separator_before: true }
              - { command: cmdGroupDate, image: sort_by, label: Date modified }
              - { command: cmdGroupType, image: sort_by, label: Type }
