# Ribbon definition — explorer markup for the rs-ribbon framework
# (the YAML equivalent of Windows ribbon `.ribbon` XML resources; schema
# documented in vendor/rs-ribbon/src/spec.rs).
#
# The COMMANDING layer lives in src/ribbon.rs: every `commands:` name maps
# to a numeric id, and the backend's CommandHandler (IUICommandHandler)
# dispatches executions to explorer actions. Contextual tabs are governed
# by UI_PKEY_ContextAvailable, published from the explorer context
# (is_drive / has_image / inside_archive / has_archive) — like the native
# ribbon framework.

commands:
  cmdAppMenu: 1
  cmdNewWindow: 2
  cmdOpenTerminal: 3
  cmdExit: 9

  cmdUndo: 18
  cmdRedo: 19
  cmdPaste: 20
  cmdPasteSpecial: 21
  cmdCut: 23
  cmdCopy: 24

  cmdMoveTo: 25
  cmdMoveToHome: 26
  cmdMoveToDesktop: 27
  cmdCopyTo: 28
  cmdCopyToHome: 29
  cmdCopyToDesktop: 30
  cmdDelete: 31
  cmdDeletePermanent: 32
  cmdRename: 33
  cmdNewFolder: 34
  cmdNewItem: 35
  cmdProperties: 36
  cmdOpen: 37
  cmdEdit: 38
  cmdHistory: 39

  cmdSelectAll: 40
  cmdSelectNone: 41
  cmdInvertSelection: 42

  cmdShareNobody: 50
  cmdShareEmail: 51

  cmdNavPane: 60
  cmdPreviewPane: 61
  cmdDetailsPane: 62
  cmdViewDetails: 63
  cmdViewLarge: 64
  cmdSortBy: 65
  cmdSortName: 66
  cmdSortSize: 67
  cmdSortModified: 68
  cmdGroupBy: 69
  cmdSizeColumns: 70
  cmdToggleCheckboxes: 71
  cmdToggleExtensions: 72
  cmdToggleHidden: 73
  cmdToggleDark: 74
  cmdToggleBorder: 75
  cmdToggleFrame: 76
  cmdFolderOptions: 77

  cmdHelp: 99

  cmdCtxMenu: 140

  cmdCtxDrive: 100
  cmdDriveProperties: 101
  cmdCtxPicture: 110
  cmdOpenPicture: 111
  cmdSetWallpaper: 112
  cmdCtxArchive: 120
  cmdExtractHere: 121

# window-size sacrifices: below ribbon_below content width the ribbon
# is hidden entirely, below nav_below the navigation pane is hidden
# (the file view resizes accordingly)
sacrifice:
  ribbon_below: 240
  nav_below: 460

# UI metrics (explorer extension)
metrics:
  # height of the navigation band (nav buttons, address bar, search box)
  band_height: 32
  # navigation pane tree rows: icon and text sizes derive from the height
  tree_item_height: 22
  tree_indention: 8
  # tree label size = icon size x this factor
  tree_font_scale: 0.7

application_menu:
  command: cmdAppMenu
  items:
    - { command: cmdNewWindow, image: new, label: New window, keytip: "N" }
    - { command: cmdOpenTerminal, image: terminal, label: Open terminal here, keytip: "T" }
    - separator: true
    - { command: cmdExit, image: exit, label: Exit, keytip: "X" }

# QAT dock: top = above the tab strip, bottom = below the command pane
# (the switch — only one QAT bar is shown at a time)
quick_access:
  commands: [cmdUndo, cmdRedo, cmdDelete]
  dock: top

help_button: cmdHelp

context_popups:
  - command: cmdCtxMenu
    items:
      - { command: cmdCut, image: cut, label: Cut }
      - { command: cmdCopy, image: copy, label: Copy }
      - { command: cmdPaste, image: paste, label: Paste }

size_definitions:
  smallish:
    - controls: [cmdCut, cmdCopy, cmdUndo, cmdRedo, cmdSelectAll, cmdSelectNone,
                 cmdInvertSelection, cmdNavPane, cmdPreviewPane, cmdDetailsPane,
                 cmdGroupBy, cmdSizeColumns, cmdToggleCheckboxes, cmdToggleExtensions,
                 cmdToggleHidden, cmdToggleDark, cmdToggleBorder, cmdToggleFrame,
                 cmdFolderOptions]
      size: small
  mediumish:
    - controls: [cmdPaste, cmdMoveTo, cmdCopyTo, cmdDelete, cmdSortBy]
      size: medium

scaling:
  - group: clipboard
    ideal: [large]
    scale: [mediumish, smallish, popup]
  - group: organize
    scale: [popup]
  - group: new
    scale: [popup]
  - group: open
    scale: [popup]
  - group: select
    scale: [popup]
  - group: share_with
    scale: [popup]
  - group: send
    scale: [popup]
  - group: panes
    scale: [popup]
  - group: layout
    scale: [popup]
  - group: current_view
    scale: [popup]
  - group: show_hide
    scale: [popup]
  - group: options
    scale: [popup]
  - group: drive
    scale: [popup]
  - group: manage
    scale: [popup]
  - group: archive
    scale: [popup]

tabs:
  # ------------------------------------------------------------ Home
  - id: home
    label: Home
    keytip: "H"
    groups:
      - id: clipboard
        label: Clipboard
        image: paste
        controls:
          - type: split_button
            command: cmdPaste
            separate: true
            size: large
            image: paste
            label: Paste
            keytip: "V"
            tooltip: "Paste the clipboard contents here"
            shortcut: "Ctrl+V"
            items:
              - { command: cmdPasteSpecial, image: paste_special, label: Paste special }
          - { type: button, command: cmdCut, size: small, image: cut, label: Cut, keytip: "X", tooltip: "Cut the selection to the clipboard", shortcut: "Ctrl+X" }
          - { type: button, command: cmdCopy, size: small, image: copy, label: Copy, keytip: "C", tooltip: "Copy the selection to the clipboard", shortcut: "Ctrl+C" }
          - { type: button, command: cmdUndo, size: small, image: undo, label: Undo, keytip: "U", tooltip: "Undo the last operation", shortcut: "Ctrl+Z" }
          - { type: button, command: cmdRedo, size: small, image: redo, label: Redo, keytip: "R", tooltip: "Redo the last undone operation", shortcut: "Ctrl+Y" }

      - id: organize
        label: Organize
        image: copy_to
        controls:
          - type: split_button
            command: cmdMoveTo
            separate: true
            size: large
            image: move_to
            label: Move to
            keytip: "M"
            items:
              - { command: cmdMoveToHome, image: open, label: Home }
              - { command: cmdMoveToDesktop, image: open, label: Desktop }
          - type: split_button
            command: cmdCopyTo
            separate: true
            size: large
            image: copy_to
            label: Copy to
            keytip: "Y"
            items:
              - { command: cmdCopyToHome, image: open, label: Home }
              - { command: cmdCopyToDesktop, image: open, label: Desktop }
          - type: split_button
            command: cmdDelete
            separate: true
            size: large
            image: delete
            label: Delete
            keytip: "D"
            tooltip: "Move the selection to the trash"
            shortcut: "Del"
            items:
              - { command: cmdDeletePermanent, image: delete, label: Delete permanently, tooltip: "Permanently delete the selection" }
          - { type: button, command: cmdRename, size: large, image: rename, label: Rename, keytip: "N", tooltip: "Rename the selected item", shortcut: "F2" }

      - id: new
        label: New
        image: new_folder
        controls:
          - { type: button, command: cmdNewFolder, size: large, image: new_folder, label: New folder, keytip: "W", tooltip: "Create a new folder here", shortcut: "Ctrl+Shift+N" }
          - { type: button, command: cmdNewItem, size: small, image: new, label: New item }

      - id: open
        label: Open
        image: properties
        controls:
          - { type: button, command: cmdProperties, size: large, image: properties, label: Properties, keytip: "I" }
          - { type: button, command: cmdOpen, size: small, image: open, label: Open }
          - { type: button, command: cmdEdit, size: small, image: edit, label: Edit }
          - { type: button, command: cmdHistory, size: small, image: history, label: History }

      - id: select
        label: Select
        image: select_all
        controls:
          - { type: button, command: cmdSelectAll, size: small, image: select_all, label: Select all, keytip: "SA", tooltip: "Select all items", shortcut: "Ctrl+A" }
          - { type: button, command: cmdSelectNone, size: small, image: select_none, label: Select none, tooltip: "Clear the selection" }
          - { type: button, command: cmdInvertSelection, size: small, image: invert_sel, label: Invert selection, tooltip: "Invert the selection" }

  # ------------------------------------------------------------ Share
  - id: share
    label: Share
    keytip: "S"
    groups:
      - id: share_with
        label: Share with
        image: properties
        controls:
          - { type: button, command: cmdShareNobody, size: small, image: properties, label: Nobody }
      - id: send
        label: Send
        image: email
        controls:
          - { type: button, command: cmdShareEmail, size: small, image: email, label: Email }

  # ------------------------------------------------------------ View
  - id: view
    label: View
    keytip: "W"
    groups:
      - id: panes
        label: Panes
        image: nav_pane
        controls:
          - { type: button, command: cmdNavPane, size: large, image: nav_pane, label: Navigation pane, keytip: "P" }
          - { type: button, command: cmdPreviewPane, size: small, image: preview_pane, label: Preview pane }
          - { type: button, command: cmdDetailsPane, size: small, image: details_pane, label: Details pane }

      - id: layout
        label: Layout
        image: view_details
        controls:
          - { type: toggle_button, command: cmdViewDetails, size: large, image: view_details, label: Details, keytip: "D", tooltip: "Show items in a detailed list" }
          - { type: toggle_button, command: cmdViewLarge, size: large, image: view_large, label: Large icons, keytip: "L", tooltip: "Show items as large icons" }

      - id: current_view
        label: Current view
        image: sort_by
        controls:
          - type: split_button
            command: cmdSortBy
            separate: true
            size: large
            image: sort_by
            label: Sort by
            keytip: "SO"
            items:
              - { command: cmdSortName, image: sort_by, label: Name, tooltip: "Sort by name" }
              - { command: cmdSortSize, image: sort_by, label: Size, tooltip: "Sort by size" }
              - { command: cmdSortModified, image: sort_by, label: Date modified, tooltip: "Sort by modification date" }
          - { type: button, command: cmdGroupBy, size: small, image: sort_by, label: Group by }
          - { type: button, command: cmdSizeColumns, size: small, image: view_details, label: Size columns to fit }

      - id: show_hide
        label: Show/hide
        image: select_none
        controls:
          - { type: button, command: cmdToggleCheckboxes, size: small, image: select_none, label: Item check boxes }
          - { type: button, command: cmdToggleExtensions, size: small, image: edit, label: File name extensions }
          - { type: toggle_button, command: cmdToggleHidden, size: small, image: view_details, label: Hidden items, keytip: "H", tooltip: "Show or hide hidden items" }

      - id: options
        label: Options
        image: gear
        controls:
          - { type: toggle_button, command: cmdToggleDark, size: small, image: gear, label: Dark mode, keytip: "DK", tooltip: "Switch between light and dark mode" }
          - { type: toggle_button, command: cmdToggleBorder, size: small, image: gear, label: Custom border, tooltip: "Use the custom window border" }
          - { type: toggle_button, command: cmdToggleFrame, size: small, image: gear, label: Win8 frame, tooltip: "Switch between Win8 and Win10 frame styles" }
          - { type: button, command: cmdFolderOptions, size: small, image: gear, label: Folder options }

  # ------------------------------------------------------------ Contextual: Drive Tools
  - id: drive_tools
    label: Manage
    keytip: "M"
    contextual: Drive Tools
    context_color: green
    context_command: cmdCtxDrive
    groups:
      - id: drive
        label: Drive
        image: properties
        controls:
          - { type: button, command: cmdDriveProperties, size: small, image: properties, label: Properties }
          - { type: button, command: cmdOpenTerminal, size: small, image: terminal, label: Open terminal, keytip: "T", tooltip: "Open a terminal in this folder" }

  # ------------------------------------------------------------ Contextual: Picture Tools
  - id: picture_tools
    label: Manage
    keytip: "P"
    contextual: Picture Tools
    context_color: gold
    context_command: cmdCtxPicture
    groups:
      - id: manage
        label: Manage
        image: pictures
        controls:
          - { type: button, command: cmdOpenPicture, size: small, image: open, label: Open, keytip: "O" }
          - { type: button, command: cmdSetWallpaper, size: small, image: pictures, label: Set as wallpaper }

  # ------------------------------------------------------------ Contextual: Archive Tools
  - id: archive_tools
    label: Manage
    keytip: "A"
    contextual: Archive Tools
    context_color: orange
    context_command: cmdCtxArchive
    groups:
      - id: archive
        label: Archive
        image: extract
        controls:
          - { type: button, command: cmdExtractHere, size: small, image: extract, label: Extract here, keytip: "E" }
          - { type: button, command: cmdOpenTerminal, size: small, image: terminal, label: Open terminal, tooltip: "Open a terminal in this folder" }
