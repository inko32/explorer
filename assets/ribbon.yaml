# window-size sacrifices: below ribbon_below content width the ribbon is
# hidden entirely, below nav_below the navigation pane is hidden (the file
# view resizes accordingly)
sacrifice:
  ribbon_below: 240
  nav_below: 460
  # below this width the preview/details pane hides (before the folder
  # view gets squeezed)
  pane_below: 800

# UI metrics (explorer extension)
metrics:
  band_height: 32
  tree_item_height: 22
  tree_indention: 8
  tree_font_scale: 0.75  # icon(16px) x scale = 12px nav labels
  bar_button_multiplier: 2.2
  gap_scale: 0.5
  # horizontal gap between the tabs on the tab strip
  tab_gap: 1
  # extra px the group titles sit lower (the bottom line follows)
  footer_shift: 3
  # functionless spacer between the nav pane (and its splitter) and the
  # folder view
  nav_gap: 4

application_menu:
  command: cmdAppMenu
  items:
    - { command: cmdNewWindow, image: new, label: New window, keytip: "N" }
    - command: cmdOpenTerminal
      image: terminal
      label: Open terminal
      keytip: "T"
      items:
        - { command: cmdOpenTerminal, image: terminal, label: Open terminal here }
        - { command: cmdOpenTerminalAdmin, image: terminal, label: Open terminal as Administrator }
    - { command: cmdFolderOptions, image: gear, label: Options, keytip: "O" }
    - separator: true
    - command: cmdHelp
      image: help
      label: Help
      keytip: "H"
      items:
        - { command: cmdHelp, image: help, label: Help }
        - { command: cmdAbout, image: help, label: About Explorer }
    - separator: true
    - { command: cmdExit, image: exit, label: Close, keytip: "X" }

quick_access:
  commands: [cmdUndo, cmdRedo, cmdDelete]
  dock: top

help_button: cmdHelp

context_popups:
  - command: cmdCtxMenu
    items:
      - { command: cmdCut, image: cut, label: Cut }
      - { command: cmdCopy, image: copy, label: Copy }
      - { command: cmdPaste, image: paste, label: Paste }

